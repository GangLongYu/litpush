# =====================================================================
# litpush 配置模板
#
# 直接改这个文件即可，改完下一次运行生效（不用重启任何东西）。
# 语法是 TOML：字符串用双引号；Windows 路径建议用单引号 'D:\data\x'。
# 删掉某一项会回退到程序内置默认值。
#
# 首次使用建议顺序：
#   1) 改 [general] output_dir 为你自己的目录
#   2) 把 [[journals]] 换成你领域的期刊（ISSN 可在期刊官网/Crossref 查）
#   3) 把 [[topics]] 换成你的关键词（这是决定推送准不准的关键）
#   4) 跑 .\litpush.cmd preview --explain 看打分，再微调
#
# 注意：下面所有期刊/关键词都是"示例"，不是推荐配置，请全部替换。
# =====================================================================

[general]
# 输出目录：日报（或速览）和每篇卡片写到这里
output_dir = 'C:/Users/YourName/Documents/Obsidian/MyVault/Papers/Daily'

# 内容语言（目前只实现了 zh）
language = "zh"

# 期刊扫描的默认回溯天数（单刊可用 lookback_days 覆盖）
days_window = 10

# 每期最多详细推送多少篇（按分数排序取前 N，其余进"其余命中"简表）
max_summaries = 10

# 是否为每篇文献生成一张独立卡片（推荐开）
per_paper_notes = true
per_paper_subdir = ""            # 留空=直接放在 output_dir 下；也可填 "cards"

# OpenAlex/Crossref 的礼貌池标识：填你自己的邮箱，能显著降低被限流的概率
polite_email = "you@example.com"
user_agent = "litpush/1.0 (personal literature digest)"

# 网络：本地缓存有效期（小时）、请求最小间隔（秒）、失败重试次数
cache_ttl_hours = 8
request_interval = 0.6
max_retries = 5

# 是否把预印本（arXiv 等）纳入
include_preprints = true

# OpenAlex 免费 API key（强烈建议，1 分钟申请）：
#   https://openalex.org/settings/api
# 不填也能跑，但匿名请求的每日额度是按 IP 共享的，容易 429。
openalex_api_key = ""


# =====================================================================
# 期刊清单（示例，请替换成你领域的）
#   tier: 1=顶刊/核心  2=领域认可  3=扩展
#   lookback_days: 该刊的扫描回溯天数
#     连续出版（在线优先）的刊 14 天够；按月出整期的刊要给到 30~40 天，
#     否则会整批漏掉。
# =====================================================================

[[journals]]
name = "Nature Machine Intelligence"
issn = "2522-5839"
tier = 1
lookback_days = 21

[[journals]]
name = "Journal of Machine Learning Research"
issn = "1532-4435"
tier = 1
lookback_days = 35

[[journals]]
name = "Nature"
issn = "0028-0836"
tier = 1
lookback_days = 14


# =====================================================================
# 研究方向：决定"什么算相关"
#
# weight  ：权重，越大越贴近你的主线（4.0 以上视为重点方向，命中标题会额外加分）
# priority：core = 命中即进入候选；secondary = 只加分不单独触发
# guard   ：可选，语境闸门。全文必须出现 guard 里的词，这个方向才算数，
#           用来挡掉"同名不同义"的误报
# patterns：正则表达式，不区分大小写；命中标题算 1.0，只命中摘要算 0.55
# =====================================================================

[[topics]]
id = "machine-learning"
label = "机器学习"
weight = 3.6
priority = "core"
guard = 'model|learning|training|neural|dataset|prediction|benchmark'
patterns = [
  'machine[\s\-]*learning',
  'deep[\s\-]*learning',
  'neural[\s\-]*network',
  'foundation[\s\-]*model',
  'large[\s\-]*language[\s\-]*model',
  '\bLLM\b',
  'transformer',
]

[[topics]]
id = "applications"
label = "领域应用"
weight = 2.0
priority = "core"
guard = 'model|data|prediction|dataset|method'
patterns = [
  'application[s]?[\s\-]*of',
  'case[\s\-]*study',
  'in[\s\-]*practice',
  'real[\s\-]*world',
]

[[topics]]
id = "methods"
label = "方法与工具"
weight = 0.8
priority = "tertiary"
guard = 'method|algorithm|framework|tool|software'
patterns = [
  'benchmark',
  'ablation',
  'fine[\s\-]*tuning',
  'reinforcement[\s\-]*learning',
  'open[\s\-]*source',
]


# =====================================================================
# 主题检索：在全部期刊里按短语搜索，用来捞核心期刊之外但很贴切的文章
# =====================================================================

[[search_queries]]
query = "machine learning"
days = 10

[[search_queries]]
query = "large language model"
days = 10

[[search_queries]]
query = "neural network benchmark"
days = 14


# =====================================================================
# 追踪关注学者（可选）：谁引用了 TA 的论文
#
# 典型用法：跟自己的论文、跟关注学者、跟领域里某个关键作者。
# 填 ORCID（推荐）或 OpenAlex 作者 ID 都可以；enabled=false 时整块不生效。
# ORCID 在 https://orcid.org/xxxx 能看到；OpenAlex 作者 ID 形如 A1234567890，
# 访问 https://api.openalex.org/authors/https://orcid.org/<ORCID> 也能查到。
# =====================================================================

[advisor]
enabled = false
name = ""                       # 显示名，留空则显示"关注学者"
name_en = ""
orcid = ""                      # 例：0000-0002-1825-0097
openalex_id = ""                # 例：A5059193287（与 orcid 二选一即可）
lookback_days = 21              # 引用动态回溯天数
refresh_days = 7                # TA 的著作列表多久刷新一次
bonus = 5.0                     # 命中"引用 TA"时给文章加的分数
keep_offtopic = true            # 与你的方向无关也保留（单独分组提示）


# =====================================================================
# 打分与分级
# =====================================================================

[scoring]
a_threshold = 9.0
b_threshold = 6.0
c_threshold = 3.5
tier1_bonus = 2.0
tier2_bonus = 1.0
tier3_bonus = 0.3
preprint_penalty = 0.8
# 重点方向（weight ≥ 4 的 core 方向）命中标题时的额外加成
focus_title_bonus = 1.5


# =====================================================================
# 可选：用大模型把摘要改写成中文精读（不填也能用）
# 兼容任何 OpenAI 格式接口：DeepSeek / 通义 / 智谱 / Ollama 本地模型都行
# =====================================================================

[llm]
enabled = false
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "LITPUSH_LLM_API_KEY"   # 从这个环境变量读 key
timeout = 120
temperature = 0.3
max_papers = 12
concurrency = 4                        # 并发数


# =====================================================================
# 渲染：Obsidian 相关
# =====================================================================

[render]
index_note = "文献推送总览.md"       # 索引页文件名（相对 output_dir）
tags = ["literature", "litpush"]     # 所有卡片的公共标签
dataview_hint = true

# 方向笔记的双链：把 topic id 映射到 Obsidian 里已有的笔记名
# 卡片里会出现 [[机器学习]] 这样的链接；笔记不存在也没关系
[topic_links]
machine-learning = "机器学习"


# =====================================================================
# 输出方式二选一
#
#   journal.enabled = false  → 文件夹模式：output_dir/2026-11-10.md 一份日报 + 卡片
#   journal.enabled = true   → 日记模式：速递追加到当天日记末尾（推荐长期用）
#
# 日记模式会读 <vault>/.obsidian/daily-notes.json 里的目录/命名格式/模板，
# 所以下面三项留空就是"跟随 Obsidian 设置"。
# =====================================================================

[journal]
enabled = false
vault = 'C:/Users/YourName/Documents/Obsidian/MyVault'
folder = ""
format = ""
template = ""
weekday_locale = "zh"
section_title = "📚 今日文献速递"
